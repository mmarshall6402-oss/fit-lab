name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # config.js is intentionally excluded: it's runtime config meant to be
      # edited in place in the S3 console (see the comment in the file
      # itself), not overwritten by the repo's dev-default on every deploy.
      #
      # Two passes so index.html always revalidates while hashed assets cache
      # forever: without this, a browser holding a cached index.html from a
      # previous build keeps requesting asset filenames that --delete has
      # since removed from the bucket, and gets 404s until it hard-refreshes.
      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist s3://fitlab-frontend-mark-058914805301-us-east-1-an \
            --delete \
            --exclude "config.js" \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp frontend/dist/index.html s3://fitlab-frontend-mark-058914805301-us-east-1-an/index.html \
            --cache-control "no-cache"

      # Trims the secret defensively: a stray trailing newline from how it was
      # pasted into GitHub silently breaks the `\` line continuation below and
      # drops --paths from the command entirely.
      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          DISTRIBUTION_ID=$(printf '%s' "$CLOUDFRONT_DISTRIBUTION_ID" | tr -d '[:space:]')
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
