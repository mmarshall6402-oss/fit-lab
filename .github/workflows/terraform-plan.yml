name: Terraform Plan

# Runs on every PR touching infra/ and posts the plan as a PR comment so it can
# be read (and argued with) before anyone runs Terraform Apply. Never applies
# anything itself - read-only against AWS.
#
# Requires infra/bootstrap's state bucket to already exist (see infra/README.md) -
# `terraform init` here fails until that one-time step has been done by hand.
#
# Secrets used (repo Settings > Secrets and variables > Actions):
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY - already exist, used by
#     deploy.yml/deploy-frontend.yml today. Reused as-is; consider migrating
#     to OIDC (no long-lived keys) as a separate future improvement.
#   CLOUDFRONT_ORIGIN_VERIFY_SECRET - required, no default in variables.tf.
#   ALARM_EMAIL - optional, only needed to override the default in variables.tf.

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan | tee plan_output.txt
        continue-on-error: true
        env:
          TF_VAR_cloudfront_origin_verify_secret: ${{ secrets.CLOUDFRONT_ORIGIN_VERIFY_SECRET }}
          TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}

      # continue-on-error above means a failed plan wouldn't otherwise fail the
      # job - this makes the PR comment step below still run (so a broken plan
      # gets posted for visibility) while still failing the overall check.
      - name: Fail job if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const outcome = '${{ steps.plan.outcome }}';
            let output = 'No plan output produced.';
            try {
              output = fs.readFileSync('infra/plan_output.txt', 'utf8');
            } catch (e) {
              // no-op - leave the default message
            }
            const maxLen = 60000;
            if (output.length > maxLen) {
              output = output.slice(0, maxLen) + '\n... (truncated)';
            }
            const marker = '<!-- terraform-plan-comment -->';
            const body = [
              marker,
              `#### Terraform Plan (${outcome})`,
              '```',
              output,
              '```',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
