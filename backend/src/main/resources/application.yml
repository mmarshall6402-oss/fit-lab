spring:
  application:
    name: fitlab-backend
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/fitlab;AUTO_SERVER=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

fitlab:
  # External, outside the project tree by default. Override for prod deploys.
  upload-dir: ${FITLAB_UPLOAD_DIR:${user.home}/fitlab-uploads}
