spring:
  application:
    name: fitlab-backend
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/fitlab;AUTO_SERVER=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

fitlab:
  # External, outside the project tree by default. Override for prod deploys.
  upload-dir: ${FITLAB_UPLOAD_DIR:${user.home}/fitlab-uploads}
  admin:
    # Shared secret gating /admin/**. Always override this in production.
    token: ${ADMIN_TOKEN:changeme-admin-token}
  jwt:
    # Signs every account auth token. Always override this in production.
    secret: ${JWT_SECRET:changeme-dev-only-jwt-secret-please-override-in-production-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:43200}
  ai:
    # Model used to auto-tag uploaded photos with colors/vibes. Only runs when
    # ANTHROPIC_API_KEY is set - otherwise auto-tagging is silently skipped.
    tagging-model: ${FITLAB_TAGGING_MODEL:claude-opus-5}
    # Model used to extract structured style preferences from free-text style
    # feedback. Same ANTHROPIC_API_KEY gate and fail-soft behavior as above.
    style-model: ${FITLAB_STYLE_MODEL:claude-opus-5}
    # Model used to judge how well an item aligns with the style profile.
    # Same ANTHROPIC_API_KEY gate and fail-soft behavior as above.
    affinity-model: ${FITLAB_AFFINITY_MODEL:claude-opus-5}
