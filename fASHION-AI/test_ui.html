<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FIT//LAB - Local Test UI</title>
<style>
  :root {
    --bg: #0d0d0d;
    --panel: #161616;
    --border: #2a2a2a;
    --accent: #ff0055;
    --text: #f2f2f2;
    --muted: #999;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", sans-serif;
    margin: 0;
    padding: 24px;
  }
  h1 {
    color: var(--accent);
    letter-spacing: 1px;
    font-size: 20px;
    margin: 0 0 20px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=password] {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 14px;
  }
  input[type=file] { font-size: 13px; color: var(--muted); }
  select {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 14px;
  }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 220px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 16px;
    font-size: 14px;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 10px; font-size: 13px; color: var(--muted); white-space: pre-wrap; }
  #topPreview { max-width: 140px; max-height: 140px; border-radius: 8px; margin-top: 8px; display: none; }

  /* Hero: the actual generated outfit */
  #hero { display: none; }
  .hero-title { font-size: 13px; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
  .hero-row { display: flex; gap: 18px; align-items: stretch; flex-wrap: wrap; }
  .hero-item { flex: 1; min-width: 180px; background: var(--panel); border: 2px solid var(--accent); border-radius: 12px; padding: 14px; text-align: center; }
  .hero-item img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; background: #000; }
  .hero-item .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; }
  .hero-item .desc { font-size: 15px; margin-top: 4px; }
  .hero-item .score { font-size: 12px; color: var(--accent); margin-top: 4px; }
  .hero-plus { display: flex; align-items: center; font-size: 24px; color: var(--muted); }

  /* Alternatives: secondary, smaller */
  .alternatives { margin-top: 24px; }
  .alternatives h2 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-weight: normal; }
  .alt-row { display: flex; gap: 20px; flex-wrap: wrap; }
  .alt-col { flex: 1; min-width: 240px; }
  .alt-card {
    display: flex;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 8px;
    align-items: center;
    opacity: 0.85;
  }
  .alt-card img { width: 44px; height: 44px; object-fit: cover; border-radius: 5px; background: #000; }
  .alt-card .meta { flex: 1; }
  .alt-card .desc { font-size: 12px; }
  .alt-card .score { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>

<h1>&#9889; FIT//LAB Local Test UI</h1>

<div class="panel">
  <div class="row">
    <div>
      <label>Server URL</label>
      <input type="text" id="serverUrl" value="http://127.0.0.1:8000">
    </div>
    <div>
      <label>X-API-Key</label>
      <input type="password" id="apiKey" placeholder="paste your FASHION_AI_API_KEY">
    </div>
  </div>

  <label>Top photo (the base item to build an outfit around)</label>
  <input type="file" id="topFile" accept="image/*">
  <img id="topPreview">

  <label>Item bank (persistent server-side pool - upload zips via POST /bank/upload-zip or rate outfits via /add-fit to grow it)</label>
  <button type="button" id="loadBankBtn" onclick="loadBank()" style="margin-top:0;">Load Bank From Server</button>
  <div id="bankStatus" class="hint"></div>

  <div class="row">
    <div>
      <label>Pants come from bank category</label>
      <select id="pantsCategorySelect"><option value="">(load bank first)</option></select>
    </div>
    <div>
      <label>Shoes come from bank category</label>
      <select id="shoesCategorySelect"><option value="">(load bank first)</option></select>
    </div>
  </div>

  <div class="row">
    <div>
      <label>Or add extra pants photos manually, on top of the bank (optional)</label>
      <input type="file" id="pantsFiles" accept="image/*" multiple>
    </div>
    <div>
      <label>Or add extra shoes photos manually, on top of the bank (optional)</label>
      <input type="file" id="shoesFiles" accept="image/*" multiple>
    </div>
  </div>

  <button id="submitBtn" onclick="runMatch()">Generate My Outfit</button>
  <div id="status"></div>
</div>

<div id="hero" class="panel">
  <div class="hero-title">Your Generated Outfit</div>
  <div class="hero-row" id="heroRow"></div>
</div>

<div class="alternatives" id="alternatives"></div>

<script>
const MAX_DIMENSION = 768;

// CLIP resizes every image internally anyway, and inventory_json is a
// Form field Starlette hard-caps at 1MB with no override - shrinking
// client-side (mirrors build_catalog.py / test_generate_outfit.py)
// keeps real camera photos under that cap.
function shrinkToBase64(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => { img.src = reader.result; };
    reader.onerror = reject;
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > MAX_DIMENSION) {
        height = Math.round(height * (MAX_DIMENSION / width));
        width = MAX_DIMENSION;
      } else if (height > MAX_DIMENSION) {
        width = Math.round(width * (MAX_DIMENSION / height));
        height = MAX_DIMENSION;
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
      resolve(dataUrl.split(",")[1]);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function filenameToDescription(name) {
  return name.replace(/\.[^/.]+$/, "").replace(/[_-]/g, " ");
}

function b64ToDataUrl(b64) {
  return "data:image/jpeg;base64," + b64;
}

let bankItemsByCategory = {};

async function loadBank() {
  const statusEl = document.getElementById("bankStatus");
  const serverUrl = document.getElementById("serverUrl").value.replace(/\/$/, "");
  const apiKey = document.getElementById("apiKey").value.trim();
  if (!apiKey) { statusEl.textContent = "Enter your X-API-Key first."; return; }

  statusEl.textContent = "Loading bank...";
  try {
    const resp = await fetch(serverUrl + "/bank", { headers: { "X-API-Key": apiKey } });
    const body = await resp.json();
    if (!resp.ok) {
      statusEl.textContent = `Error ${resp.status}: ${body.detail || JSON.stringify(body)}`;
      return;
    }

    bankItemsByCategory = {};
    body.items.forEach(item => {
      if (!bankItemsByCategory[item.category]) bankItemsByCategory[item.category] = [];
      bankItemsByCategory[item.category].push(item);
    });

    const pantsSelect = document.getElementById("pantsCategorySelect");
    const shoesSelect = document.getElementById("shoesCategorySelect");
    const options = ['<option value="">(none)</option>'].concat(
      body.categories.map(c => `<option value="${c}">${c} (${bankItemsByCategory[c].length})</option>`)
    ).join("");
    pantsSelect.innerHTML = options;
    shoesSelect.innerHTML = options;
    // Reasonable defaults if a category is literally named "pants"/"shoes".
    if (body.categories.includes("pants")) pantsSelect.value = "pants";
    if (body.categories.includes("shoes")) shoesSelect.value = "shoes";

    statusEl.textContent = `Loaded ${body.count} items across ${body.categories.length} categories: ${body.categories.join(", ") || "(bank is empty)"}`;
  } catch (err) {
    statusEl.textContent = "Failed to load bank: " + err.message;
  }
}

async function readManualFiles(fileList, idOffset) {
  const files = Array.from(fileList);
  const items = [];
  for (let i = 0; i < files.length; i++) {
    items.push({
      id: idOffset + i + 1,
      description: filenameToDescription(files[i].name),
      image_base64: await shrinkToBase64(files[i]),
    });
  }
  return items;
}

// Re-number ids so catalog items + manually added items never collide.
function renumber(items) {
  return items.map((item, i) => ({ ...item, id: i + 1 }));
}

function renderHeroItem(label, item) {
  const div = document.createElement("div");
  div.className = "hero-item";
  if (!item) {
    div.innerHTML = `<div class="label">${label}</div><div class="desc" style="color:var(--muted)">no candidates provided</div>`;
    return div;
  }
  div.innerHTML =
    `<img src="${item._imgSrc}">` +
    `<div class="label">${label}</div>` +
    `<div class="desc">${item.description || "(no description)"}</div>` +
    `<div class="score">score: ${item.match_score.toFixed(3)}</div>`;
  return div;
}

function renderAlternatives(title, byId, ranked) {
  const col = document.createElement("div");
  col.className = "alt-col";
  const h2 = document.createElement("h2");
  h2.textContent = title + " - other options";
  col.appendChild(h2);

  const rest = (ranked || []).slice(1); // best one is already in the hero
  if (rest.length === 0) {
    const p = document.createElement("div");
    p.style.color = "var(--muted)";
    p.style.fontSize = "12px";
    p.textContent = "No other candidates.";
    col.appendChild(p);
    return col;
  }

  rest.forEach(r => {
    const card = document.createElement("div");
    card.className = "alt-card";
    const src = byId[r.id] ? byId[r.id]._imgSrc : "";
    card.innerHTML =
      `<img src="${src}">` +
      `<div class="meta">` +
      `<div class="desc">${r.description || "(no description)"}</div>` +
      `<div class="score">score: ${r.match_score.toFixed(3)}</div>` +
      `</div>`;
    col.appendChild(card);
  });

  return col;
}

async function runMatch() {
  const statusEl = document.getElementById("status");
  const heroEl = document.getElementById("hero");
  const heroRowEl = document.getElementById("heroRow");
  const altEl = document.getElementById("alternatives");
  const btn = document.getElementById("submitBtn");
  heroEl.style.display = "none";
  heroRowEl.innerHTML = "";
  altEl.innerHTML = "";

  const serverUrl = document.getElementById("serverUrl").value.replace(/\/$/, "");
  const apiKey = document.getElementById("apiKey").value.trim();
  const topFile = document.getElementById("topFile").files[0];

  if (!apiKey) { statusEl.textContent = "Enter your X-API-Key first."; return; }
  if (!topFile) { statusEl.textContent = "Pick a top photo first."; return; }

  btn.disabled = true;
  statusEl.textContent = "Preparing photos...";

  try {
    const pantsCategory = document.getElementById("pantsCategorySelect").value;
    const shoesCategory = document.getElementById("shoesCategorySelect").value;
    const pantsBankItems = pantsCategory ? (bankItemsByCategory[pantsCategory] || []) : [];
    const shoesBankItems = shoesCategory ? (bankItemsByCategory[shoesCategory] || []) : [];
    const pantsManualItems = await readManualFiles(document.getElementById("pantsFiles").files, pantsBankItems.length);
    const shoesManualItems = await readManualFiles(document.getElementById("shoesFiles").files, shoesBankItems.length);

    const pantsItems = renumber([...pantsBankItems, ...pantsManualItems]);
    const shoesItems = renumber([...shoesBankItems, ...shoesManualItems]);

    const pantsById = {};
    pantsItems.forEach(it => pantsById[it.id] = { ...it, _imgSrc: b64ToDataUrl(it.image_base64) });
    const shoesById = {};
    shoesItems.forEach(it => shoesById[it.id] = { ...it, _imgSrc: b64ToDataUrl(it.image_base64) });

    const inventory = {
      pants: pantsItems.map(({ id, description, image_base64 }) => ({ id, description, image_base64 })),
      shoes: shoesItems.map(({ id, description, image_base64 }) => ({ id, description, image_base64 })),
    };

    statusEl.textContent = "Sending to " + serverUrl + " ...";

    const form = new FormData();
    form.append("inventory_json", JSON.stringify(inventory));
    form.append("file", topFile);

    const resp = await fetch(serverUrl + "/generate-outfit-from-top", {
      method: "POST",
      headers: { "X-API-Key": apiKey },
      body: form,
    });

    const body = await resp.json();

    if (!resp.ok) {
      statusEl.textContent = `Error ${resp.status}: ${body.detail || JSON.stringify(body)}`;
      btn.disabled = false;
      return;
    }

    statusEl.textContent = `OK (${resp.status})`;

    const rec = body.recommended_outfit || {};
    const bestPants = rec.best_pants_match && rec.best_pants_match[0];
    const bestShoes = rec.best_shoes_match && rec.best_shoes_match[0];

    const topReader = new FileReader();
    topReader.onload = () => {
      const topItem = { _imgSrc: topReader.result, description: filenameToDescription(topFile.name), match_score: null };
      heroRowEl.innerHTML = "";
      const topDiv = document.createElement("div");
      topDiv.className = "hero-item";
      topDiv.innerHTML = `<img src="${topItem._imgSrc}"><div class="label">Top</div><div class="desc">${topItem.description}</div>`;
      heroRowEl.appendChild(topDiv);

      const plus1 = document.createElement("div");
      plus1.className = "hero-plus";
      plus1.textContent = "+";
      heroRowEl.appendChild(plus1);

      heroRowEl.appendChild(renderHeroItem(
        "Pants",
        bestPants ? { ...bestPants, _imgSrc: pantsById[bestPants.id] ? pantsById[bestPants.id]._imgSrc : "" } : null
      ));

      const plus2 = document.createElement("div");
      plus2.className = "hero-plus";
      plus2.textContent = "+";
      heroRowEl.appendChild(plus2);

      heroRowEl.appendChild(renderHeroItem(
        "Shoes",
        bestShoes ? { ...bestShoes, _imgSrc: shoesById[bestShoes.id] ? shoesById[bestShoes.id]._imgSrc : "" } : null
      ));

      heroEl.style.display = "block";
    };
    topReader.readAsDataURL(topFile);

    const altRow = document.createElement("div");
    altRow.className = "alt-row";
    altRow.appendChild(renderAlternatives("Pants", pantsById, rec.best_pants_match));
    altRow.appendChild(renderAlternatives("Shoes", shoesById, rec.best_shoes_match));
    altEl.appendChild(altRow);
  } catch (err) {
    statusEl.textContent = "Request failed: " + err.message + "\n(Check the server is running, and that ALLOWED_ORIGINS includes the origin this page is served from - see instructions.)";
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("topFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  const preview = document.getElementById("topPreview");
  if (file) {
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  } else {
    preview.style.display = "none";
  }
});
</script>

</body>
</html>
